<style>
  :root { --erro:#a8200f; }
  @media (prefers-color-scheme: dark) { :root { --erro:#ff9a8c; } }
  html[data-contraste="alto"] { --erro:#ff9a8c; }
  .btn { display:inline-flex; align-items:center; justify-content:center; min-height:48px; min-width:48px; padding:10px 18px; border-radius:10px; border:2px solid var(--acc); background:var(--acc); color:#1a1a1a; font:inherit; font-weight:700; cursor:pointer; text-decoration:none; }
  .btn.sec { background:transparent; color:var(--ink); border-color:var(--line); }
  .qtd { display:flex; align-items:center; gap:8px; margin-top:8px; }

  input[type=text], input[type=tel], input[type=number] { width:100%; min-height:48px; padding:10px 12px; border-radius:10px; border:2px solid var(--line); background:var(--card); color:var(--ink); font:inherit; box-sizing:border-box; }

  .ok { border:2px solid var(--acc); text-align:center; }
  .acoes { display:flex; justify-content:space-between; gap:12px; margin-top:20px; flex-wrap:wrap; }
  .passo { display:inline-block; font-weight:800; padding:4px 12px; border:2px solid var(--acc); border-radius:999px; margin:0 0 12px; }
  .obrig { color:var(--erro); font-weight:700; font-size:.9em; }
  .legenda { margin:0 0 8px; color:var(--mut); }
